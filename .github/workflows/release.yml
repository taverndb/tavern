name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Test
        run: ctest --preset release
      - name: Install
        run: cmake --install build/release --prefix stage
      - name: Create archive
        shell: bash
        run: |
          mkdir dist
          platform="$(uname -s | tr '[:upper:]' '[:lower:]')"
          archive="dist/tavern-${GITHUB_REF_NAME}-${platform}-$(uname -m).tar.gz"
          tar -C stage -czf "$archive" .
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: tavern-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.tar.gz \
              --generate-notes
          fi
